name: Update tide calendars

on:
  push:
    branches: [main]        # redeploy on every code change
  schedule:
    - cron: "17 9 1 * *"   # monthly (1st), ~02:17 America/Los_Angeles -- refresh data
  workflow_dispatch: {}     # allow manual runs

# Generated feeds are deployed straight to Pages as an artifact -- never
# committed -- so git history does not accumulate large .ics files.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate .ics feeds
        run: python generate.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
