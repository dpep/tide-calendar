# Tide-current calendar config.
#
# Each entry under `stations:` produces one .ics feed at docs/<slug>.ics.
# Add, remove, or comment out entries to control which locations are
# published -- this is the "pick your locations" knob.
#
# Find more stations on the NOAA map (filter: Current Predictions):
#   https://tidesandcurrents.noaa.gov/map/index.html?type=CurrentPredictions
#
# `bin` selects the depth layer (SF Bay stations report several). The values
# below are the shallowest bin -- closest to the surface current a boat
# actually feels. Adjust or omit if NOAA rejects it.
#
# `lat`/`lon` are filled in automatically on the first run (looked up from
# NOAA) and cached here so later runs skip the metadata lookup.

# How far the feeds reach. A wide window means a calendar that refreshes
# infrequently still has plenty of events; `days_back` keeps recent history.
days_back: 30
days_ahead: 90

# How often calendar clients are asked to re-fetch the feed (a hint many,
# including Google Calendar, largely ignore for URL subscriptions).
refresh_days: 7

stations:
  - slug: alcatraz
    name: Alcatraz Island
    id: SFB1204
    lat: 37.81425
    lon: -122.432
    bin: 18
    description: Alcatraz Island, southwest of (station SFB1204)

